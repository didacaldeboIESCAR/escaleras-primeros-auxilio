<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escaleras y Serpientes · First Aid and Injuries</title>
<style>
  :root { --bg:#f3f6f4; --card:#fff; --ink:#1d2a24; --muted:#6b7a72; --accent:#c8102e; --ok:#1f9d55; --bad:#d64545; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; } header small { opacity:.85 }
  main { display:grid; grid-template-columns: minmax(0, 640px) 320px; gap:16px; padding:16px; justify-content:center; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  svg#board { width:100%; height:auto; display:block; border-radius:10px; }
  h2 { font-size:15px; margin:0 0 8px; }
  input, button { font:inherit; }
  input { padding:8px 10px; border:1px solid #ccd5d0; border-radius:8px; width:100%; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { background:#b9c3be; cursor:not-allowed; }
  button.ghost { background:#e9eeeb; color:var(--ink); }
  .row { display:flex; gap:8px; margin:6px 0; align-items:center; }
  .players { list-style:none; padding:0; margin:0; }
  .players li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; }
  .players li.turn { background:#fff3c4; font-weight:700; }
  .dot { width:14px; height:14px; border-radius:50%; flex:none; border:2px solid #fff; box-shadow:0 0 0 1px #0003; }
  .off { opacity:.45 }
  #log { font-size:13px; color:var(--muted); max-height:200px; overflow:auto; padding-left:18px; margin:0; }
  #dice { font-size:46px; line-height:1; min-width:52px; text-align:center; }
  .status { font-size:14px; margin:6px 0 10px; }
  .side > .card { margin-bottom:14px; }
  /* Pregunta */
  #qwrap { position:fixed; inset:0; background:rgba(20,30,25,.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #qwrap.show { display:flex; }
  #qbox { background:#fff; border-radius:14px; max-width:560px; width:100%; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  #qkind { font-size:14px; font-weight:700; padding:6px 10px; border-radius:8px; display:inline-block; }
  #qkind.ladder { background:#e3f6ea; color:#17683a; } #qkind.snake { background:#fde7e7; color:#9b2222; }
  #qtext { font-size:20px; font-weight:700; margin:12px 0; }
  #qopts { display:grid; gap:8px; }
  #qopts button { text-align:left; background:#eef2f0; color:var(--ink); font-weight:500; padding:11px 12px; border:2px solid transparent; }
  #qopts button:not(:disabled):hover { border-color:var(--accent); }
  #qopts button:disabled { cursor:default; color:var(--ink); }
  #qopts button.right { background:#d8f3e2; border-color:var(--ok); }
  #qopts button.wrong { background:#fbdcdc; border-color:var(--bad); }
  #qopts b { display:inline-block; width:24px; }
  #timer { height:8px; background:#e6ebe8; border-radius:4px; overflow:hidden; margin:12px 0 4px; }
  #timer div { height:100%; background:var(--accent); width:100%; transition: width .25s linear; }
  #qinfo { font-size:13px; color:var(--muted); }
  #qexpl { margin-top:12px; padding:10px 12px; border-radius:8px; background:#f1f6ff; font-size:14px; display:none; }
  #qresult { font-weight:700; margin-top:10px; font-size:16px; }
  .hidden { display:none !important; }
  #winner { font-size:18px; font-weight:800; color:var(--ok); }
</style>
</head>
<body>
<header><h1>🪜🐍 Escaleras y Serpientes</h1><small>First Aid and Injuries · Vocabulary Unit 2</small></header>

<main>
  <div class="card"><svg id="board" viewBox="0 0 600 600"></svg></div>

  <div class="side">
    <div class="card" id="joinCard">
      <h2 id="joinTitle">Crear una partida</h2>
      <div class="row"><input id="name" placeholder="Tu nombre" maxlength="16"></div>
      <input id="room" type="hidden">
      <div class="row" id="createRow"><button id="createBtn">Crear partida y obtener enlace</button></div>
      <div class="row hidden" id="inviteRow"><button id="joinBtn">Unirse a la partida</button><button class="ghost" id="watchBtn">Solo mirar</button></div>
      <div id="joinErr" style="color:var(--bad);font-size:13px"></div>
    </div>

    <div class="card hidden" id="shareCard">
      <h2>🔗 Enlace para invitar</h2>
      <div style="font-size:13px;color:var(--muted)">Envía este enlace a los jugadores (WhatsApp, Classroom, proyector…):</div>
      <div class="row"><input id="shareLink" readonly onclick="this.select()"></div>
      <div class="row"><button id="copyBtn">Copiar enlace</button><button class="ghost" id="shareBtn">Compartir</button></div>
    </div>

    <div class="card hidden" id="gameCard">
      <h2>Sala <span id="roomCode"></span></h2>
      <div class="status" id="status"></div>
      <div id="winner"></div>
      <div class="row hidden" id="hostCtl">
        <label style="font-size:13px;white-space:nowrap">Tiempo por pregunta (s)</label>
        <input id="qtime" type="number" min="5" max="120" value="20" style="width:80px">
        <button id="startBtn">Empezar</button>
      </div>
      <div class="row">
        <div id="dice">🎲</div>
        <button id="rollBtn" disabled>Tirar dado</button>
      </div>
      <div class="row hidden" id="hostCtl2">
        <button class="ghost" id="skipBtn">Saltar turno</button>
        <button class="ghost" id="resetBtn">Reiniciar</button>
      </div>
    </div>

    <div class="card">
      <h2>Jugadores</h2>
      <ul class="players" id="players"></ul>
    </div>

    <div class="card">
      <h2>Registro</h2>
      <ol id="log"></ol>
    </div>
  </div>
</main>

<div id="qwrap">
  <div id="qbox">
    <span id="qkind"></span>
    <div id="qtext"></div>
    <div id="qopts"></div>
    <div id="timer"><div></div></div>
    <div id="qinfo"></div>
    <div id="qresult"></div>
    <div id="qexpl"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LETTERS = ['A', 'B', 'C', 'D'];
const DICE = ['⚀','⚁','⚂','⚃','⚄','⚅'];
let S = null, me = { token: null, id: null, room: null }, es = null, skew = 0, shownEventT = 0, feedbackUntil = 0;

const params = new URLSearchParams(location.search);
const invited = (params.get('sala') || params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
$('name').value = localStorage.getItem('ss_name') || '';
if (invited) {
  $('room').value = invited;
  $('joinTitle').textContent = `Te han invitado a la partida ${invited}`;
  $('createRow').classList.add('hidden'); $('inviteRow').classList.remove('hidden');
  // Si ya estabas en esta sala (recarga de página), vuelve a entrar solo
  const saved = JSON.parse(localStorage.getItem('ss_tok_' + invited) || 'null');
  if (saved && saved.token) setTimeout(() => $('joinBtn').click(), 0);
}
const linkFor = code => `${location.origin}${location.pathname}?sala=${code}`;
function showShare(code) {
  $('shareLink').value = linkFor(code);
  $('shareCard').classList.remove('hidden');
  history.replaceState(null, '', '?sala=' + code);
}
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText($('shareLink').value); } catch { $('shareLink').select(); document.execCommand('copy'); }
  $('copyBtn').textContent = '¡Copiado!'; setTimeout(() => $('copyBtn').textContent = 'Copiar enlace', 1500);
};
$('shareBtn').onclick = () => navigator.share
  ? navigator.share({ title: 'Escaleras y Serpientes · First Aid', text: '¡Únete a mi partida!', url: $('shareLink').value }).catch(() => {})
  : $('copyBtn').click();
$('createBtn').onclick = () => {
  if (!$('name').value.trim()) { $('joinErr').textContent = 'Escribe tu nombre'; return; }
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  $('room').value = Array.from({ length: 5 }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
  $('joinBtn').click();
};

async function api(action, body = {}) {
  const r = await fetch('/api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ room: me.room, token: me.token, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}

function connect() {
  if (es) es.close();
  es = new EventSource(`/events?room=${encodeURIComponent(me.room)}&token=${encodeURIComponent(me.token || '')}`);
  es.onmessage = e => { S = JSON.parse(e.data); skew = S.serverNow - Date.now(); render(); };
  $('joinCard').classList.add('hidden'); $('gameCard').classList.remove('hidden');
}

$('joinBtn').onclick = async () => {
  me.room = $('room').value.trim() || 'AULA';
  const saved = JSON.parse(localStorage.getItem('ss_tok_' + me.room.toUpperCase()) || 'null');
  try {
    const j = await api('join', { name: $('name').value, token: saved && saved.token });
    me = { token: j.token, id: j.id, room: j.room };
    localStorage.setItem('ss_tok_' + j.room, JSON.stringify(me));
    localStorage.setItem('ss_name', $('name').value);
    connect(); showShare(j.room);
  } catch (e) { $('joinErr').textContent = e.message; }
};
$('watchBtn').onclick = () => { me = { token: null, id: null, room: $('room').value }; connect(); showShare(me.room); };
$('startBtn').onclick = () => api('start', { questionTime: $('qtime').value }).catch(e => alert(e.message));
$('rollBtn').onclick = () => { $('rollBtn').disabled = true; api('roll').catch(e => alert(e.message)); };
$('skipBtn').onclick = () => api('skip').catch(e => alert(e.message));
$('resetBtn').onclick = () => confirm('¿Volver a la sala de espera?') && api('reset').catch(e => alert(e.message));

// ---------- Tablero ----------
const CELL = 60;
function xy(n) { const i = n - 1, row = Math.floor(i / 10), col = row % 2 ? 9 - (i % 10) : i % 10;
  return [col * CELL + CELL / 2, (9 - row) * CELL + CELL / 2]; }

function drawBoard(ladders, snakes) {
  let s = '';
  for (let n = 1; n <= 100; n++) {
    const [cx, cy] = xy(n), x = cx - 30, y = cy - 30;
    const fill = ladders[n] ? '#d9f2e2' : snakes[n] ? '#fbe0e0' : ((Math.floor((n-1)/10) + (n-1)) % 2 ? '#fffdf5' : '#f4efe1');
    s += `<rect x="${x}" y="${y}" width="60" height="60" fill="${fill}" stroke="#e2dccb"/>`;
    s += `<text x="${x+4}" y="${y+14}" font-size="12" fill="#8a8370" font-weight="600">${n}</text>`;
  }
  for (const [a, b] of Object.entries(ladders)) {
    const [x1, y1] = xy(+a), [x2, y2] = xy(b), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L * 9, ny = dx / L * 9;
    s += `<g stroke="#8b5a2b" stroke-width="5" stroke-linecap="round" opacity=".9">
      <line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}"/>`;
    for (let k = 1; k < L / 22; k++) { const t = k * 22 / L, px = x1 + dx * t, py = y1 + dy * t;
      s += `<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke-width="3.5"/>`; }
    s += `</g>`;
  }
  for (const [a, b] of Object.entries(snakes)) {
    const [x1, y1] = xy(+a), [x2, y2] = xy(b), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const c1x = mx + (y2 - y1) * .25, c1y = my - (x2 - x1) * .25;
    s += `<path d="M${x1},${y1} Q${c1x},${c1y} ${x2},${y2}" fill="none" stroke="#2f8f3a" stroke-width="11" stroke-linecap="round" opacity=".85"/>
      <path d="M${x1},${y1} Q${c1x},${c1y} ${x2},${y2}" fill="none" stroke="#a4e07a" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
      <circle cx="${x1}" cy="${y1}" r="9" fill="#2f8f3a"/><circle cx="${x1-3}" cy="${y1-3}" r="2" fill="#fff"/><circle cx="${x1+3}" cy="${y1-3}" r="2" fill="#fff"/>`;
  }
  s += `<g id="tokens"></g>`;
  $('board').innerHTML = s;
}

let boardDrawn = false;
function drawTokens() {
  const byCell = {};
  S.players.forEach(p => (byCell[p.pos] = byCell[p.pos] || []).push(p));
  let s = '';
  for (const [pos, ps] of Object.entries(byCell)) {
    const [cx, cy] = xy(+pos);
    ps.forEach((p, i) => { const ang = ps.length > 1 ? i / ps.length * Math.PI * 2 : 0, r = ps.length > 1 ? 13 : 0;
      const isTurn = S.players[S.turn] && S.players[S.turn].id === p.id && S.status !== 'lobby';
      s += `<circle cx="${cx + Math.cos(ang) * r}" cy="${cy + 6 + Math.sin(ang) * r}" r="11" fill="${p.color}" stroke="${isTurn ? '#111' : '#fff'}" stroke-width="${isTurn ? 3 : 2.5}"><title>${esc(p.name)}</title></circle>`; });
  }
  $('tokens').innerHTML = s;
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const nameOf = id => (S.players.find(p => p.id === id) || {}).name || '?';

// ---------- Render ----------
function render() {
  if (!boardDrawn) { drawBoard(S.ladders, S.snakes); boardDrawn = true; }
  drawTokens();
  $('roomCode').textContent = S.code;
  const cur = S.players[S.turn], myTurn = cur && cur.id === me.id, isHost = me.id === S.hostId;

  $('players').innerHTML = S.players.map(p => `<li class="${S.status !== 'lobby' && cur && cur.id === p.id ? 'turn' : ''} ${p.online ? '' : 'off'}">
    <span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.id === me.id ? ' (tú)' : ''}${p.id === S.hostId ? ' 👑' : ''}
    <span style="margin-left:auto;color:var(--muted)">casilla ${p.pos}</span></li>`).join('') || '<li style="color:var(--muted)">Nadie todavía</li>';
  $('log').innerHTML = S.log.map(l => `<li>${esc(l)}</li>`).join('');
  $('log').scrollTop = 1e6;

  $('hostCtl').classList.toggle('hidden', !(isHost && S.status !== 'playing' && S.status !== 'question'));
  $('hostCtl2').classList.toggle('hidden', !(isHost && (S.status === 'playing' || S.status === 'question')));
  $('startBtn').textContent = S.status === 'finished' ? 'Nueva partida' : 'Empezar';
  if (document.activeElement !== $('qtime')) $('qtime').value = S.questionTime;

  const busy = Date.now() + skew < S.busyUntil;
  $('rollBtn').disabled = !(S.status === 'playing' && myTurn && !busy);
  if (busy) setTimeout(render, S.busyUntil - Date.now() - skew + 50);

  let st = '';
  if (S.status === 'lobby') st = isHost ? 'Elige el tiempo por pregunta y pulsa Empezar.' : 'Esperando a que el anfitrión 👑 empiece…';
  else if (S.status === 'playing') st = myTurn ? '<b>¡Es tu turno!</b> Tira el dado.' : `Turno de <b>${esc(cur ? cur.name : '')}</b>.`;
  else if (S.status === 'question') st = `<b>${esc(nameOf(S.question.playerId))}</b> está respondiendo…`;
  else if (S.status === 'finished') st = 'Partida terminada.';
  $('status').innerHTML = st;
  $('winner').textContent = S.winner ? `🏆 ¡Gana ${nameOf(S.winner)}!` : '';

  const ev = S.lastEvent;
  if (ev && ev.type === 'roll') $('dice').textContent = DICE[ev.dice - 1];
  renderQuestion();
}

let tickTimer = null;
function renderQuestion() {
  const ev = S.lastEvent;
  if (S.question) { shownEventT = 0; return showQuestion(S.question); }
  // Mostrar la corrección + explicación a todos durante unos segundos
  if (ev && ev.type === 'answer' && Date.now() + skew - ev.t < 4500) {
    if (shownEventT !== ev.t) { shownEventT = ev.t; showFeedback(ev); }
    return;
  }
  $('qwrap').classList.remove('show'); clearInterval(tickTimer);
}

function kindText(q, who) {
  return q.kind === 'ladder'
    ? `🪜 Escalera ${q.from} → ${q.to}: si ${who} acierta, sube a ${q.to}.`
    : `🐍 Serpiente ${q.from} → ${q.to}: si ${who} acierta, se libra; si falla, baja a ${q.to}.`;
}

function showQuestion(q) {
  const mine = q.playerId === me.id;
  $('qwrap').classList.add('show');
  $('qkind').className = q.kind; $('qkind').textContent = kindText(q, mine ? 'tú' : nameOf(q.playerId));
  $('qtext').textContent = q.text;
  if ($('qopts').dataset.key !== String(q.deadline)) {
    $('qopts').dataset.key = q.deadline;
    $('qopts').innerHTML = q.options.map((o, i) => `<button data-i="${i}" ${mine ? '' : 'disabled'}><b>${LETTERS[i]}</b>${esc(o)}</button>`).join('');
    $('qopts').querySelectorAll('button').forEach(b => b.onclick = () => {
      $('qopts').querySelectorAll('button').forEach(x => x.disabled = true);
      b.style.borderColor = '#555';
      api('answer', { choice: +b.dataset.i }).catch(e => alert(e.message));
    });
  }
  $('qinfo').textContent = mine ? 'Responde antes de que se acabe el tiempo.' : `Solo ${nameOf(q.playerId)} puede responder. ¡Piensa la respuesta tú también!`;
  $('qresult').textContent = ''; $('qexpl').style.display = 'none'; $('timer').style.visibility = 'visible';
  clearInterval(tickTimer);
  const tick = () => { const left = Math.max(0, q.deadline - (Date.now() + skew));
    $('timer').firstElementChild.style.width = (left / (S.questionTime * 1000) * 100) + '%';
    $('qinfo').dataset.left = Math.ceil(left / 1000);
    $('qinfo').textContent = (mine ? 'Tu turno · ' : `Responde ${nameOf(q.playerId)} · `) + `⏱ ${Math.ceil(left / 1000)} s`; };
  tick(); tickTimer = setInterval(tick, 250);
}

function showFeedback(ev) {
  clearInterval(tickTimer);
  $('qwrap').classList.add('show');
  $('qkind').className = ev.kind; $('qkind').textContent = kindText(ev, ev.playerId === me.id ? 'tú' : nameOf(ev.playerId));
  $('qtext').textContent = ev.text;
  $('qopts').dataset.key = '';
  $('qopts').innerHTML = ev.options.map((o, i) => `<button disabled class="${i === ev.correctIndex ? 'right' : i === ev.choice ? 'wrong' : ''}"><b>${LETTERS[i]}</b>${esc(o)}</button>`).join('');
  $('timer').style.visibility = 'hidden'; $('qinfo').textContent = '';
  const who = nameOf(ev.playerId);
  const head = ev.timeout ? `⏰ Se acabó el tiempo.` : ev.correct ? '✅ ¡Correcto!' : '❌ Incorrecto.';
  const res = ev.kind === 'ladder' ? (ev.correct ? `${who} sube a la casilla ${ev.finalPos}.` : `${who} se queda en la casilla ${ev.finalPos}.`)
                                   : (ev.correct ? `${who} esquiva la serpiente y se queda en ${ev.finalPos}.` : `${who} baja a la casilla ${ev.finalPos}.`);
  $('qresult').textContent = `${head} ${res}`;
  $('qresult').style.color = ev.correct ? 'var(--ok)' : 'var(--bad)';
  $('qexpl').style.display = 'block'; $('qexpl').textContent = '📘 ' + ev.explanation;
  setTimeout(render, 4600);
}
</script>
</body>
</html>
